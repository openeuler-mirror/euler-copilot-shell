line-length = 120
indent-width = 4
target-version = "py311"

[lint]
# 存量阶段仅启用错误类规则（E/F/I），按路线图逐步收紧到安全/最佳实践/风格类
select = ["E", "F", "I"]
ignore = [
    "ANN401",
    "ARG002",
    "D400",
    "D415",
    "PYI019",
    "RUF001",
    "RUF002",
    "RUF003",
    "S104",
    "TD002",
    "TD003",
    "INP001",
    "D203",
    "D212",
    "S101"
]

[format]
quote-style = "double"
